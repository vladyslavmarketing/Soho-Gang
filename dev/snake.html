<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Snake engine — dev</title>
<style>
  /* Standalone test bed for assets/js/snake.js (no site CSS). Query flags: ?debug=1  ?reduced=1  ?panel=0 */
  :root {
    color-scheme: light;
    --paper: #F1D6DA; --paper-2: #E9C3CA; --fur: #D7899A; --fur-deep: #B85F75;
    --cream: #F4EADB; --ink: #1E1618; --ink-2: #5A3540; --white: #FFF8F9;
    --font-body: "Onest", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); overflow-x: hidden; }

  /* Hero: seamless powder-pink studio backdrop; the snake canvas is transparent on top */
  .hero {
    position: relative; min-height: 100vh; min-height: 100svh; overflow: hidden;
    background:
      radial-gradient(70% 55% at 0% 0%, rgba(227, 188, 196, .95), rgba(227, 188, 196, 0) 70%),
      radial-gradient(70% 55% at 100% 0%, rgba(227, 188, 196, .95), rgba(227, 188, 196, 0) 70%),
      radial-gradient(90% 70% at 55% 100%, #F6E2E4 0%, rgba(246, 226, 228, 0) 72%),
      var(--paper);
  }
  .hero__canvas, .band__canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* "studio" caption locks up under the snake's "ae", right-aligned (same formula as the site CSS) */
  .hero__studio {
    position: absolute; margin: 0; pointer-events: none;
    left: calc(var(--logo-x, 0px) + var(--logo-w, 0px));
    top: calc(var(--logo-y, 0px) + var(--logo-h, 0px) - var(--logo-h, 0px) * 0.02);
    transform: translateX(-100%);
    font-weight: 800; font-size: calc(var(--logo-w, 0px) * 0.2); line-height: .9; letter-spacing: -.035em;
    color: var(--white); text-shadow: 0 6px 18px rgba(120, 40, 60, .25);
    opacity: 0; transition: opacity .9s cubic-bezier(.16, 1, .3, 1);
  }
  .hero.is-written .hero__studio { opacity: 1; }
  .hero__copy { position: absolute; left: max(16px, 4vw); bottom: 12vh; max-width: 40ch; }
  .hero__copy h1 { margin: 0 0 .4em; font-size: clamp(2.2rem, 5vw, 4.6rem); line-height: .95; letter-spacing: -.035em; font-weight: 800; }
  .hero__copy p { margin: 0; color: var(--ink-2); font-size: 17px; line-height: 1.6; }
  .hero__copy a { display: inline-block; margin-top: 18px; padding: 14px 22px; border-radius: 999px; background: var(--ink); color: var(--cream); text-decoration: none; font-weight: 600; }
  @media (max-width: 959px) { .hero__copy { top: calc(92px + (100vw - 32px) / 1.85 + 72px); bottom: auto; right: 16px; left: 16px; } }

  /* Dev panel */
  .panel {
    position: fixed; z-index: 10; right: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    max-width: calc(100vw - 24px); padding: 8px; border-radius: 14px; background: rgba(255, 248, 249, .82);
    box-shadow: 0 6px 24px rgba(120, 40, 60, .15); font: 500 11px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .08em;
  }
  .panel button { font: inherit; letter-spacing: inherit; text-transform: inherit; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); border-radius: 999px; padding: 7px 11px; cursor: pointer; }
  .panel button:hover { background: var(--cream); }
  .panel button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .panel output { padding: 0 6px; color: var(--ink-2); min-width: 15ch; }

  /* Fur band: footer-like strip with the wandering snake */
  .band { position: relative; height: 360px; overflow: hidden; background: #D7899A url(../assets/img/fur.jpg) center / cover; }
  .band::after { content: ""; position: absolute; inset: 0; background: rgba(215, 137, 154, .08); pointer-events: none; }
  .band__label { position: absolute; z-index: 2; left: 16px; bottom: 14px; margin: 0; padding: 6px 10px; border-radius: 8px; background: var(--ink); color: var(--cream); font: 500 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; }
  .after { padding: 48px 16px 80px; text-align: center; color: var(--ink-2); font: 500 12px/1.6 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; }
</style>
</head>
<body>
  <section class="hero" id="hero">
    <canvas class="hero__canvas" id="hero-canvas" aria-hidden="true"></canvas>
    <p class="hero__studio" aria-hidden="true">studio</p>
    <div class="hero__copy">
      <h1>Мягкий старт.<br>Большой доход.</h1>
      <p>Наведи курсор — она смотрит. Кликни — поползёт за тобой.</p>
      <a href="#band">Ссылка (не запускает погоню)</a>
    </div>
  </section>

  <section class="band" id="band">
    <canvas class="band__canvas" id="band-canvas" aria-hidden="true"></canvas>
    <p class="band__label">wander · fur band 360px</p>
  </section>
  <p class="after">snake.js dev bed · ?debug=1 · ?reduced=1</p>

  <div class="panel" data-no-chase id="panel">
    <button type="button" id="b-replay">Replay</button>
    <button type="button" id="b-pause">Pause</button>
    <button type="button" id="b-chase">Chase</button>
    <output id="o-stat" aria-live="off">…</output>
  </div>

  <script src="../assets/js/snake.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var hero = document.getElementById('hero');
      var reduced = q.has('reduced') ? q.get('reduced') !== '0' : undefined;
      if (q.get('panel') === '0') document.getElementById('panel').hidden = true;
      if (!window.SohoSnake) { hero.classList.add('is-written'); return; }

      var heroCanvas = document.getElementById('hero-canvas');
      var log = [];
      heroCanvas.addEventListener('snake:written', function () { hero.classList.add('is-written'); log.push('written@' + (performance.now() / 1000).toFixed(2)); });
      heroCanvas.addEventListener('snake:chase', function () { log.push('chase@' + (performance.now() / 1000).toFixed(2)); });

      var hs = window.heroSnake = SohoSnake.mount(heroCanvas, { mode: 'logo', pointerTarget: hero, reducedMotion: reduced, debug: q.get('debug') === '1' });
      var bs = window.bandSnake = SohoSnake.mount(document.getElementById('band-canvas'), { mode: 'wander', pointerTarget: document.getElementById('band'), reducedMotion: reduced });
      window.snakeLog = log;

      var paused = false;
      document.getElementById('b-replay').onclick = function () { hero.classList.remove('is-written'); hs.replay(); };
      document.getElementById('b-pause').onclick = function () {
        paused = !paused; this.textContent = paused ? 'Resume' : 'Pause';
        if (paused) { hs.pause(); bs.pause(); } else { hs.resume(); bs.resume(); }
      };
      document.getElementById('b-chase').onclick = function () {
        var b = hs.getLogoBox(); hs.chase(Math.max(40, b.x - b.w * 0.3), b.y + b.h * 1.1);
      };
      var out = document.getElementById('o-stat');
      setInterval(function () { out.textContent = 'hero ' + hs.stats.ms.toFixed(2) + 'ms · band ' + bs.stats.ms.toFixed(2) + 'ms'; }, 500);
    })();
  </script>
</body>
</html>
